name: Integration Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    name: dockertest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache-dependency-path: integration-test/go.sum
      - name: Run dockertest unit tests
        run: go test -v -timeout 5m ./dockertest/
        working-directory: integration-test

  test:
    name: integration-test ${{ matrix.libc_type }} .NET ${{ matrix.version }}
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        libc_type: [glibc, musl]
        version: ['8.0', '9.0', '10.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache-dependency-path: integration-test/go.sum
      - name: Run integration test
        run: go test -v -timeout 60m -count=1 .
        env:
          LIBC_TYPE: ${{ matrix.libc_type }}
          DOTNET_VERSION: ${{ matrix.version }}
        working-directory: integration-test

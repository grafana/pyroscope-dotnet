name: C++ profiler unit tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-cpp-profiler:
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
    env:
      DOCKER_BUILDKIT: 1
    strategy:
      fail-fast: false
      matrix:
        libc: ['glibc', 'musl']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Build and run C++ unit tests (${{ matrix.libc }})
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            DOCKERFILE=Pyroscope.musl.Dockerfile
          else
            DOCKERFILE=Pyroscope.Dockerfile
          fi
          docker build --target test \
            --build-arg CMAKE_BUILD_TYPE=Debug \
            -f ${DOCKERFILE} .

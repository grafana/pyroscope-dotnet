name: C++ profiler unit tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  test-cpp-profiler:
    name: C++ profiler unit tests (${{ matrix.arch }}, ${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_BUILDKIT: 1
    strategy:
      fail-fast: false
      matrix:
        libc: ['glibc', 'musl']
        arch: ['x86_64', 'aarch64']
        include:
          - arch: x86_64
            runner: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-large' || 'ubuntu-latest' }}
          - arch: aarch64
            runner: ${{ github.repository_owner == 'grafana' && 'ubuntu-arm64-large' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: 'true'
          persist-credentials: false
      - name: Build and run C++ unit tests (${{ matrix.arch }}, ${{ matrix.libc }})
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            DOCKERFILE=Pyroscope.musl.Dockerfile
          else
            DOCKERFILE=Pyroscope.Dockerfile
          fi
          docker build --target test \
            --build-arg CMAKE_BUILD_TYPE=Debug \
            -f ${DOCKERFILE} .

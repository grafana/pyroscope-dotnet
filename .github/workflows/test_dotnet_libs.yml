name: Test .NET libraries

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: dotnet test ${{ matrix.project }}
    runs-on: ${{ github.repository_owner == 'grafana' && 'ubuntu-x64-small' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        project:
          # Pyroscope.Tests covers the async scope propagation: whether a scope opened by a
          # request reaches the threads that run its `await` continuations, and is taken
          # off them afterwards. That is the half of async stack stitching the native unit
          # tests cannot see.
          - Pyroscope/Pyroscope.Tests
          - Pyroscope/Pyroscope.OpenTelemetry.Tests
          - Pyroscope/Pyroscope.OpenTracing.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: 'true'
          persist-credentials: false
      - uses: actions/setup-dotnet@131b410979e0b49e2162c0718030257b22d6dc2c
        with:
          global-json-file: global.json
      - run: dotnet test -c Release
        working-directory: ${{ matrix.project }}
